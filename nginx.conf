# VideoTV Nginx Configuration
# 主域: www.videotvai.com (带www) - 与百度站长平台一致
# URL规范化(2026-08-14): .html 为 canonical，无后缀 URL 301 → .html

# www HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name www.videotvai.com;
    return 301 https://www.videotvai.com$request_uri;
}

# 非www HTTP → www HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name videotvai.com;
    return 301 https://www.videotvai.com$request_uri;
}

# 非www HTTPS → www HTTPS 重定向
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name videotvai.com;
    ssl_certificate /etc/letsencrypt/live/videotvai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videotvai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.videotvai.com$request_uri;
}

# 主站点 (www HTTPS)
server {
    server_name www.videotvai.com;
    root /var/www/videotvai;
    index index.html;

    access_log /var/log/nginx/videotvai_access.log;
    error_log /var/log/nginx/videotvai_error.log;
    charset utf-8;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 自定义401登录页
    error_page 401 /login.html;

    # 经营仪表盘（密码保护 + noindex）
    location ^~ /dashboard/ {
        root /var/www/videotvai;
        try_files /dashboard/index.html =404;
        auth_basic "速豹tw 经营仪表盘";
        auth_basic_user_file /etc/nginx/.dashboard_pass;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # .html 为 canonical：无后缀 URL 若对应 .html 文件存在，301 到 .html
    location / {
        if (-f $document_root$uri.html) {
            return 301 $uri.html;
        }
        try_files $uri $uri/ =404;
    }

    # .html 请求直接命中文件，否则 404
    location ~ ^(.+)\.html$ {
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/videotvai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videotvai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
