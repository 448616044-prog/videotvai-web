name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debug - List files
        run: |
          echo "📁 Root HTML files:"
          ls -1 *.html 2>/dev/null || echo "  (none)"
          echo "📁 Blog HTML files:"
          ls -1 blog/*.html 2>/dev/null || echo "  (none)"
          echo "📁 sitemap.xml:"
          ls -la sitemap.xml 2>/dev/null || echo "  (none)"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: 22
          timeout: 15s
          script: |
            echo "SSH连接成功"
            hostname
            whoami
            ls /var/www/videotvai/ | head -5

      - name: Deploy HTML files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: 22
          source: "*.html,sitemap.xml"
          target: "/var/www/videotvai/"
          overwrite: true

      - name: Deploy blog files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: 22
          source: "blog/*.html"
          target: "/var/www/videotvai/blog/"
          overwrite: true

      - name: Verify deployment and reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/videotvai
            echo "📄 index.html 行数: $(wc -l < index.html)"
            echo "📄 live-health.html 行数: $(wc -l < live-health.html)"
            echo "📄 live-health.html 有闭合标签: $(grep -c '</html>' live-health.html)"
            nginx -t && systemctl reload nginx && echo "✅ Nginx 已重启"
            echo "🎉 部署完成!"
