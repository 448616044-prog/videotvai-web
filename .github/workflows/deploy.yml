name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH key
        env:
          SSH_KEY_BASE64: ${{ secrets.CVM_SSH_KEY }}
          CVM_HOST: ${{ secrets.CVM_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if echo "$SSH_KEY_BASE64" | base64 -d &>/dev/null; then
            echo "$SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
            echo "Base64 decoded"
          else
            echo "$SSH_KEY_BASE64" > ~/.ssh/deploy_key
            echo "Plain text key"
          fi
          chmod 600 ~/.ssh/deploy_key
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key && echo "Key format OK" || { echo "Key format ERROR"; exit 1; }
          ssh-keyscan -H $CVM_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH and check permissions
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST << 'ENDSSH'
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "Can write /var/www/videotvai/: $(test -w /var/www/videotvai/ && echo YES || echo NO)"
            echo "Can sudo: $(sudo -n true 2>/dev/null && echo YES || echo NO)"
            ls -ld /var/www/videotvai/
          ENDSSH

      - name: Deploy files
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e

          # 打包所有文件
          tar czf /tmp/deploy.tar.gz *.html blog/*.html sitemap.xml
          echo "Package size: $(du -h /tmp/deploy.tar.gz | cut -f1)"

          # SCP 到 /tmp（所有用户都有写权限）
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/deploy.tar.gz $CVM_USER@$CVM_HOST:/tmp/deploy.tar.gz
          echo "SCP to /tmp OK"

          # SSH 解压到目标目录
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST << 'ENDSSH'
            set -e
            cd /var/www/videotvai
            mkdir -p blog

            # 尝试直接解压，如果权限不够则用 sudo
            if tar xzf /tmp/deploy.tar.gz 2>/dev/null; then
              echo "Extracted directly"
            else
              echo "Permission denied, using sudo..."
              sudo tar xzf /tmp/deploy.tar.gz
              echo "Extracted with sudo"
            fi
            rm -f /tmp/deploy.tar.gz

            # 验证
            echo "index.html: $(wc -l < index.html) lines"
            echo "live-health.html: $(wc -l < live-health.html) lines"
            echo "live-health.html </html>: $(grep -c '</html>' live-health.html)"
            echo "remote-consultation.html: $(wc -l < remote-consultation.html) lines"

            # 重启 nginx
            nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || sudo nginx -t && sudo systemctl reload nginx
            echo "Nginx reloaded"
            echo "Deployment complete!"
          ENDSSH
