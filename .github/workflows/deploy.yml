name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH key
        env:
          SSH_KEY_BASE64: ${{ secrets.CVM_SSH_KEY }}
          CVM_HOST: ${{ secrets.CVM_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if echo "$SSH_KEY_BASE64" | base64 -d &>/dev/null; then
            echo "$SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
            echo "Base64 decoded"
          else
            echo "$SSH_KEY_BASE64" > ~/.ssh/deploy_key
            echo "Plain text key"
          fi
          chmod 600 ~/.ssh/deploy_key
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key && echo "Key format OK" || { echo "Key format ERROR"; exit 1; }
          ssh-keyscan -H $CVM_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key setup complete"

      - name: Test SSH connection
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e
          echo "Testing SSH to $CVM_USER@$CVM_HOST..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST << 'ENDSSH'
            echo "SSH连接成功"
            hostname
            whoami
            ls /var/www/videotvai/ | head -5
          ENDSSH

      - name: Deploy files via SCP
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e
          echo "Listing local files:"
          ls -1 *.html | wc -l
          echo "Root HTML files listed above"
          ls -1 blog/*.html 2>/dev/null | wc -l
          echo "Blog HTML files listed above"

          echo "SCP root files..."
          scp -O -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no *.html $CVM_USER@$CVM_HOST:/var/www/videotvai/

          echo "SCP sitemap..."
          scp -O -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no sitemap.xml $CVM_USER@$CVM_HOST:/var/www/videotvai/

          echo "SCP blog files..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST "mkdir -p /var/www/videotvai/blog"
          scp -O -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no blog/*.html $CVM_USER@$CVM_HOST:/var/www/videotvai/blog/

          echo "All files transferred"

      - name: Verify and reload nginx
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST << 'ENDSSH'
            set -e
            cd /var/www/videotvai
            echo "index.html: $(wc -l < index.html) lines"
            echo "live-health.html: $(wc -l < live-health.html) lines"
            echo "live-health.html has </html>: $(grep -c '</html>' live-health.html)"
            nginx -t && systemctl reload nginx && echo "Nginx reloaded"
            echo "Deployment complete!"
          ENDSSH
