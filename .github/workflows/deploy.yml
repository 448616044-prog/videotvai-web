name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to CVM via SSH
        env:
          SSH_KEY_BASE64: ${{ secrets.CVM_SSH_KEY }}
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e

          echo "🔄 开始部署 VideoTV 网站..."

          # 解码 SSH 私钥
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY_BASE64" | base64 -d &>/dev/null; then
            echo "$SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
            echo "✅ SSH 密钥已解码（Base64 格式）"
          else
            echo "$SSH_KEY_BASE64" > ~/.ssh/deploy_key
            echo "✅ SSH 密钥已读取（明文格式）"
          fi

          chmod 600 ~/.ssh/deploy_key

          if grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "✅ SSH 密钥格式验证通过"
          else
            echo "❌ SSH 密钥格式错误"
            exit 1
          fi

          ssh-keyscan -H $CVM_HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "📤 通过 tar+ssh 传输文件到服务器..."

          # 创建远程目录（确保 blog/ 存在）
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST "mkdir -p /var/www/videotvai/blog"

          # 用 tar over SSH 传输所有 HTML 文件（比 SCP 多文件更可靠）
          tar czf - *.html blog/*.html sitemap.xml 2>/dev/null | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST "cd /var/www/videotvai && tar xzf - && echo '✅ 解压完成'"

          echo "✅ 文件传输完成"

          # 远程验证并重启 nginx
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST << 'ENDSSH'
            set -e
            cd /var/www/videotvai
            echo "📁 部署目录: $(pwd)"
            echo "📄 index.html 行数: $(wc -l < index.html)"
            echo "📄 live-health.html 行数: $(wc -l < live-health.html)"
            echo "📄 remote-consultation.html 行数: $(wc -l < remote-consultation.html)"
            if [ -f "index.html" ]; then echo "✅ index.html 存在"; else echo "❌ index.html 不存在!"; exit 1; fi
            if command -v nginx &> /dev/null; then sudo nginx -t && sudo systemctl reload nginx && echo "✅ Nginx 已重启"; fi
            echo "🎉 部署流程完成!"
          ENDSSH

          echo "========================================"
          echo "📊 部署任务状态: 成功"
          echo "⏰ 完成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"

      - name: Deployment Status
        if: always()
        run: |
          echo "========================================"
          echo "📊 部署任务状态: ${{ job.status }}"
          echo "⏰ 完成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"
