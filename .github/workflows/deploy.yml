name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to CVM
        env:
          SSH_KEY_BASE64: ${{ secrets.CVM_SSH_KEY }}
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ secrets.CVM_USER }}
        run: |
          set -e

          echo "🔄 开始部署..."

          # 列出文件
          echo "📁 HTML文件数: $(ls -1 *.html | wc -l)"
          echo "📁 Blog文件数: $(ls -1 blog/*.html 2>/dev/null | wc -l)"

          # 解码 SSH 密钥
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if echo "$SSH_KEY_BASE64" | base64 -d &>/dev/null; then
            echo "$SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
            echo "✅ 密钥已解码(Base64)"
          else
            echo "$SSH_KEY_BASE64" > ~/.ssh/deploy_key
            echo "✅ 密钥已读取(明文)"
          fi
          chmod 600 ~/.ssh/deploy_key
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key && echo "✅ 密钥格式正确" || { echo "❌ 密钥格式错误"; exit 1; }

          ssh-keyscan -H $CVM_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # 测试SSH
          echo "🔌 测试SSH..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 $CVM_USER@$CVM_HOST "echo 'SSH OK' && hostname"

          # 用 rsync 部署（比 scp 更可靠）
          echo "📤 rsync 传输..."
          rsync -avz --rsh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" *.html sitemap.xml $CVM_USER@$CVM_HOST:/var/www/videotvai/
          rsync -avz --rsh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" blog/*.html $CVM_USER@$CVM_HOST:/var/www/videotvai/blog/

          # 验证并重启nginx
          echo "🔧 验证部署..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $CVM_USER@$CVM_HOST 'bash -s' << 'ENDSSH'
            set -e
            cd /var/www/videotvai
            echo "📄 index.html: $(wc -l < index.html) 行"
            echo "📄 live-health.html: $(wc -l < live-health.html) 行"
            echo "📄 live-health.html </html>: $(grep -c '</html>' live-health.html)"
            nginx -t && systemctl reload nginx && echo "✅ Nginx已重启"
            echo "🎉 部署完成!"
          ENDSSH
