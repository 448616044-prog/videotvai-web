name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.CVM_SSH_KEY }}
    
    - name: Add host to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.CVM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
    
    - name: Test SSH Connection
      run: |
        echo "🔍 测试SSH连接..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.CVM_USER }}@${{ secrets.CVM_HOST }} "echo '✅ SSH连接成功'" || (echo "❌ SSH连接失败" && exit 1)
    
    - name: Deploy to CVM
      env:
        CVM_HOST: ${{ secrets.CVM_HOST }}
        CVM_USER: ${{ secrets.CVM_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "🚀 开始部署到腾讯云CVM..."
        # 使用rsync同步文件
        rsync -avz --delete \
          --exclude='.git*' \
          --exclude='.github' \
          --exclude='README.md' \
          --exclude='baidu_push.py' \
          ./ ${{ secrets.CVM_USER }}@${{ secrets.CVM_HOST }}:${{ secrets.DEPLOY_PATH }}
        echo "✅ 代码已同步到服务器"
    
    - name: Baidu Push
      env:
        BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
      run: |
        echo "📤 开始百度主动推送..."
        # 获取所有HTML页面URL
        urls=$(find . -name "*.html" -not -path "./.git/*" -not -name "admin.html" | sed 's|^\./|https://www.videotvai.com/|' | sed 's|/index.html$|/|' | sort -u)
        
        # 推送URL到百度
        echo "$urls" | curl -s -X POST "http://data.zz.baidu.com/urls?site=https://www.videotvai.com&token=$BAIDU_TOKEN" \
          -H "Content-Type: text/plain" --data-binary @-
        echo ""
        echo "✅ 百度推送完成"
    
    - name: Notify
      if: always()
      run: |
        echo "📧 部署状态: ${{ job.status }}"
