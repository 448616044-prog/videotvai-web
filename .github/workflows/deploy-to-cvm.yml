name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CVM_HOST }}
        username: ${{ secrets.CVM_USER }}
        key: ${{ secrets.CVM_SSH_KEY }}
        command_timeout: 120
        script: |
          cd /var/www/videotvai
          git fetch origin
          git reset --hard origin/main
          echo "✅ 部署完成: $(git log --oneline -1)"

    - name: Verify
      run: |
        echo "✅ GitHub commit: $(git log --oneline -1)"
        echo "🌐 https://www.videotvai.com"
