name: Deploy to Tencent CVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CVM_HOST }}
        username: ${{ secrets.CVM_USER }}
        key: ${{ secrets.CVM_SSH_KEY }}
        command_timeout: 120
        script: |
          set -e
          DEPLOY_DIR="/var/www/videotvai"
          # 修复目录权限（服务器目录为root创建）
          sudo chown -R ubuntu:ubuntu $DEPLOY_DIR
          # 进入目录并拉取最新代码
          cd $DEPLOY_DIR
          git fetch origin
          git reset --hard origin/main
          echo "✅ Deploy OK: $(git log --oneline -1)"

    - name: Verify
      run: |
        echo "✅ GitHub commit: $(git log --oneline -1)"
        echo "🌐 https://www.videotvai.com"
